[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "joshua-audiobook-studio"
version = "0.1.0"
description = "Local-first, source-faithful audiobook generation for the Joshua workspace."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "httpx>=0.28,<1",
  "pypdf>=6.0,<7",
  "python-docx>=1.2,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12",
]

[project.scripts]
audiobook = "audiobook_studio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_studio"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
  "integration: tests that use real workspace artifacts",
  "gpu: tests that require a local GPU model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["’", "–"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["audiobook_studio"]
