voice_direction: >-
  Warm, gentle young adult male audiobook narrator with a soft lower-mid register
  and a subtle neutral-to-Australian English accent. Compassionate, open, thoughtful,
  and quietly hopeful. Speak at a patient literary pace of about 125 to 135 words per
  minute, with natural breaths and generous pauses between ideas. Let warmth be audible
  in the tone, especially when speaking about Ginger Juice. Keep the delivery intimate
  and sincere. Never sound hurried, clipped, forceful, theatrical, gravelly, elderly,
  or like a commercial announcer.
reference_text: >-
  I have been thinking about this for a long time. Ginger Juice deserves room to move,
  to play, and to feel safe. I only hope that, if I speak gently and honestly, Uncle
  might understand why it matters so much.
audition_text: >-
  I am determined to be strong and confident in my plea to Uncle, but my first attempt
  is shot down fast. I finally approach him when he returns from the warung and is
  preparing the tables for the evening domino game. Dangdut music crackles from the
  transistor radio.

  'A what?' he asks. 'For who?'

  'A large enclosure!' I repeat with a flourish of my hands to try and indicate its
  grandeur. 'For Ginger Juice, so she can roll and play and climb as she used to do.'
