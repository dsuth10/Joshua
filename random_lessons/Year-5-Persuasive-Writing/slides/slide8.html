<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F9F7F7; font-family: Arial, sans-serif;
  color: #112D4E; display: flex; flex-direction: column;
}
.header { background: #112D4E; padding: 20pt 40pt; }
h1 { font-size: 32pt; color: #F96D00; margin: 0; }
.content { padding: 40pt; display: flex; }
.col { flex: 1; padding: 10pt; background: white; border-radius: 10pt; margin: 10pt; border-top: 5pt solid; }
.evidence { border-color: #F96D00; }
.link { border-color: #C0392B; }
h2 { font-size: 22pt; margin-top: 0; }
p { font-size: 18pt; line-height: 1.4; }
</style>
</head>
<body>
  <div class="header">
    <h1>PEEL: Evidence & Link</h1>
  </div>
  <div class="content">
    <div class="col evidence">
      <h2 style="color: #F96D00;">Evidence</h2>
      <p>The "Proof." Use a fact, a statistic, or a real-life example to back up your claim.</p>
    </div>
    <div class="col link">
      <h2 style="color: #C0392B;">Link</h2>
      <p>The wrap-up. Connect this argument back to the main topic of your essay.</p>
    </div>
  </div>
</body>
</html>
