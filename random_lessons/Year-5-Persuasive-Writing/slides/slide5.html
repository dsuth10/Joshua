<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F9F7F7; font-family: Arial, sans-serif;
  color: #112D4E; display: flex; flex-direction: column;
}
.header { background: #112D4E; padding: 20pt 40pt; }
h1 { font-size: 32pt; color: #F96D00; margin: 0; }
.content { padding: 40pt; }
.step { display: flex; align-items: center; margin-bottom: 10pt; font-size: 22pt; }
.circle { 
  width: 40pt; height: 40pt; background: #F96D00; color: white; border-radius: 50%;
  display: flex; justify-content: center; align-items: center; margin-right: 20pt;
  font-weight: bold; font-size: 24pt;
}
</style>
</head>
<body>
  <div class="header">
    <h1>Whole Essay Structure</h1>
  </div>
  <div class="content">
    <div class="step"><div class="circle"><p>1</p></div><p>Introduction (Signpost arguments)</p></div>
    <div class="step"><div class="circle"><p>2</p></div><p>Body Paragraphs (PEEL structure)</p></div>
    <div class="step"><div class="circle"><p>3</p></div><p>Conclusion (Summarise & Call to Action)</p></div>
  </div>
</body>
</html>
