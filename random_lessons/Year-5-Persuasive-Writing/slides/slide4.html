<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F9F7F7; font-family: Arial, sans-serif;
  color: #112D4E; display: flex; flex-direction: column;
}
.header { background: #112D4E; padding: 20pt 40pt; }
h1 { font-size: 32pt; color: #F96D00; margin: 0; }
.content { padding: 30pt 40pt; }
.peel-box { 
  display: flex; justify-content: space-between; margin-top: 20pt;
}
.peel-item {
  width: 150pt; text-align: center; padding: 15pt; border-radius: 10pt; color: #FFFFFF; 
  font-weight: bold; font-size: 18pt;
}
.p { background: #3F72AF; }
.e1 { background: #4E9F3D; }
.e2 { background: #F96D00; }
.l { background: #C0392B; }
.desc { font-size: 14pt; margin-top: 10pt; color: #112D4E; font-weight: normal; }
</style>
</head>
<body>
  <div class="header">
    <h1>The PEEL Structure</h1>
  </div>
  <div class="content">
    <div class="peel-box">
      <div class="peel-item p"><p>Point</p><p class="desc">What is your main idea?</p></div>
      <div class="peel-item e1"><p>Elaboration</p><p class="desc">Explain it further.</p></div>
      <div class="peel-item e2"><p>Evidence</p><p class="desc">Prove it with facts.</p></div>
      <div class="peel-item l"><p>Link</p><p class="desc">Connect back to the topic.</p></div>
    </div>
  </div>
</body>
</html>
