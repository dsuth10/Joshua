<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F9F7F7; font-family: Arial, sans-serif;
  color: #112D4E; display: flex; flex-direction: column;
}
.header { 
  background: #112D4E; padding: 20pt 40pt; 
}
h1 { font-size: 32pt; color: #F96D00; margin: 0; }
.content { padding: 40pt; display: flex; }
.col { flex: 1; }
ul { font-size: 20pt; line-height: 1.5; margin-top: 0; }
li { margin-bottom: 10pt; }
b { color: #F96D00; }
</style>
</head>
<body>
  <div class="header">
    <h1>Persuasive Toolkit</h1>
  </div>
  <div class="content">
    <div class="col">
      <ul>
        <li><b>Alliteration:</b> Repeated sounds.</li>
        <li><b>Rhetorical Questions:</b> Questions that don't need answers.</li>
        <li><b>Emotive Language:</b> Words that trigger feelings.</li>
      </ul>
    </div>
    <div class="col">
      <ul>
        <li><b>Rule of Three:</b> Fast, fun, and fantastic!</li>
        <li><b>Statistics:</b> Facts and numbers to prove your point.</li>
      </ul>
    </div>
  </div>
</body>
</html>
