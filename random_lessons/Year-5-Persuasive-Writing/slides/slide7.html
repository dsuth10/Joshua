<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F9F7F7; font-family: Arial, sans-serif;
  color: #112D4E; display: flex; flex-direction: column;
}
.header { background: #112D4E; padding: 20pt 40pt; }
h1 { font-size: 32pt; color: #F96D00; margin: 0; }
.content { padding: 40pt; display: flex; }
.col { flex: 1; padding: 10pt; background: white; border-radius: 10pt; margin: 10pt; border-top: 5pt solid; }
.point { border-color: #3F72AF; }
.elaboration { border-color: #4E9F3D; }
h2 { font-size: 22pt; margin-top: 0; }
p { font-size: 18pt; line-height: 1.4; }
</style>
</head>
<body>
  <div class="header">
    <h1>PEEL: Point & Elaboration</h1>
  </div>
  <div class="content">
    <div class="col point">
      <h2 style="color: #3F72AF;">Point</h2>
      <p>Your opening statement. It should be one clear sentence that states your argument.</p>
    </div>
    <div class="col elaboration">
      <h2 style="color: #4E9F3D;">Elaboration</h2>
      <p>Explain your point. Why is it true? How does it work? Give more details.</p>
    </div>
  </div>
</body>
</html>
