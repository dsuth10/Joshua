<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #112d4e; color: #f9f7f7; margin: 0; padding: 40px; display: flex; flex-direction: column; justify-content: center; height: 100vh; box-sizing: border-box; text-align: center; }
  h1 { color: #f96d00; font-size: 72px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
  h2 { color: #3f72af; font-size: 40px; margin-bottom: 30px; }
  p, li { font-size: 28px; color: #e0e0e0; line-height: 1.5; }
  ul { text-align: left; margin-left: 20px; }
  .header { text-align: left; margin-bottom: 20px; border-bottom: 2px solid #3f72af; padding-bottom: 10px; }
  .content { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
  .two-column { display: flex; flex-direction: row; justify-content: space-between; flex-grow: 1; align-items: center; gap: 40px; }
  .col { flex: 1; background-color: rgba(63, 114, 175, 0.2); padding: 30px; border-radius: 10px; height: 100%; display: flex; flex-direction: column; justify-content: flex-start; }
  .col h3 { color: #f96d00; font-size: 36px; margin-top: 0; text-align: center; border-bottom: 1px solid #3f72af; padding-bottom: 15px; }
</style>
</head>
<body>

  <h1>Who runs Australia?</h1>
  <h2>Australian Democracy & Parliament</h2>
  <p><p>Understanding the monarch, Governor-General, House of Representatives and Senate</p></p>

</body>
</html>
