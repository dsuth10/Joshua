<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details | Sir Henry Parkes: Quest for Unity</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎩</text></svg>">
    <style>
        .detail-card {
            background: white;
            border: 2px solid var(--accent);
            padding: 40px;
            margin-top: 50px;
            box-shadow: 20px 20px 0px var(--accent-light);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .detail-header {
            text-align: center;
            border-bottom: 2px solid var(--vp-muted);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s;
        }

        .back-btn:hover {
            transform: translateX(-5px);
        }

        .event-image-container {
            width: 100%;
            height: 300px;
            background: #eee;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid var(--vp-muted);
        }

        .event-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .event-content {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .event-content h3 {
            margin-top: 30px;
            color: var(--accent);
        }

        .event-content ul {
            margin-left: 20px;
        }

        .event-content li {
            margin-bottom: 10px;
        }

        .loading-screen {
            text-align: center;
            padding: 100px;
        }
    </style>
</head>

<body>
    <div class="progress-container">
        <div class="progress-bar" id="myBar" style="width: 100%;"></div>
    </div>

    <div class="story-container">
        <div id="event-detail-container">
            <div class="loading-screen">
                <h2>Loading Event Details...</h2>
            </div>
        </div>

        <footer style="text-align: center; padding: 50px 0; border-top: 1px solid var(--vp-muted);">
            <p>&copy; 2026 Joshua Project - Year 5 HASS Curriculum Resource</p>
        </footer>
    </div>

    <script src="event-data.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('event-detail-container');
            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('event');

            if (eventId && eventData[eventId]) {
                const data = eventData[eventId];
                container.innerHTML = `
                    <a href="index.html#timeline" class="back-btn">← Back to Journey</a>
                    <div class="detail-card reveal active">
                        <div class="detail-header">
                            <h1>${data.title}</h1>
                            <p style="font-style: italic; color: var(--text-muted);">${data.subtitle}</p>
                        </div>
                        <div class="event-image-container">
                            <img src="${data.image}" alt="${data.title}" onerror="this.src='https://placehold.co/800x400?text=Historical+Image'">
                        </div>
                        <div class="event-content">
                            ${data.content}
                        </div>
                        <div style="margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px; text-align: center;">
                            <p><em>Use the points above to help with your timeline notes!</em></p>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="loading-screen">
                        <h2>Oops! Event not found.</h2>
                        <a href="index.html" class="back-btn" style="margin-top: 20px;">Return to the Quest</a>
                    </div>
                `;
            }
        });
    </script>
</body>

</html>
