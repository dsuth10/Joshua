<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 720pt;
            height: 405pt;
            margin: 0;
            padding: 0;
            background-color: #F4F1DE;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            width: 720pt;
            padding: 15pt 0;
            background-color: #3A6B35;
            color: #F4F1DE;
        }

        h1 {
            margin: 0;
            font-size: 24pt;
            padding-left: 30pt;
        }

        .content {
            padding: 30pt;
        }

        .scenario-box {
            width: 620pt;
            background-color: #FFFFFF;
            padding: 25pt;
            border-radius: 10pt;
            border-left: 10pt solid #E07A5F;
        }

        h2 {
            color: #3A6B35;
            font-size: 22pt;
            margin-top: 0;
        }

        p {
            font-size: 18pt;
            color: #2C2C2C;
            margin-bottom: 15pt;
        }

        .challenge {
            font-weight: bold;
            color: #E07A5F;
            font-size: 20pt;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Fair Test Challenge #1</h1>
    </div>
    <div class="content">
        <div class="scenario-box">
            <h2>The Bread Experiment</h2>
            <p>Sarah wants to see if light affects mould growth. She puts one piece of bread in a <b>dark, cool
                    cupboard</b> and another piece on a <b>sunny, warm windowsill</b>.</p>
            <p class="challenge">Is this a Fair Test? Why or why not?</p>
        </div>
    </div>
</body>

</html>
