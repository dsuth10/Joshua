<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 720pt;
            height: 405pt;
            margin: 0;
            padding: 0;
            background-color: #F4F1DE;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            width: 720pt;
            padding: 15pt 0;
            background-color: #3A6B35;
            color: #F4F1DE;
        }

        h1 {
            margin: 0;
            font-size: 24pt;
            padding-left: 30pt;
        }

        .content {
            padding: 20pt;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }

        .factor-box {
            width: 280pt;
            background: #FFFFFF;
            margin-bottom: 20pt;
            padding: 15pt;
            border-radius: 8pt;
            border-left: 10pt solid #CBD18F;
        }

        h3 {
            color: #3A6B35;
            margin: 0 0 10pt 0;
            font-size: 20pt;
        }

        p {
            font-size: 16pt;
            color: #2C2C2C;
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Environmental Factors</h1>
    </div>
    <div class="content">
        <div class="factor-box">
            <h3>Salinity</h3>
            <p>The amount of salt in the water or soil.</p>
        </div>
        <div class="factor-box">
            <h3>Temperature</h3>
            <p>How hot or cold the environment is.</p>
        </div>
        <div class="factor-box">
            <h3>Water Availability</h3>
            <p>How much water is available for the living thing.</p>
        </div>
        <div class="factor-box">
            <h3>Sunlight</h3>
            <p>The energy from the sun needed for growth.</p>
        </div>
    </div>
</body>

</html>
