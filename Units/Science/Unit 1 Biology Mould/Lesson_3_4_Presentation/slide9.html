<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 720pt;
            height: 405pt;
            margin: 0;
            padding: 0;
            background-color: #F4F1DE;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            width: 720pt;
            padding: 15pt 0;
            background-color: #3A6B35;
            color: #F4F1DE;
        }

        h1 {
            margin: 0;
            font-size: 24pt;
            padding-left: 30pt;
        }

        .content {
            padding: 30pt;
        }

        .scenario-box {
            width: 620pt;
            background-color: #FFFFFF;
            padding: 25pt;
            border-radius: 10pt;
            border-left: 10pt solid #3D405B;
        }

        h2 {
            color: #3A6B35;
            font-size: 22pt;
            margin-top: 0;
        }

        p {
            font-size: 18pt;
            color: #2C2C2C;
            margin-bottom: 15pt;
        }

        .challenge {
            font-weight: bold;
            color: #3D405B;
            font-size: 20pt;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Fair Test Challenge #4</h1>
    </div>
    <div class="content">
        <div class="scenario-box">
            <h2>Salt vs Fresh</h2>
            <p>Leo wants to see if salt water stops seeds from sprouting. He puts <b>10 seeds</b> in a fresh water pot
                and only <b>5 seeds</b> in a salt water pot.</p>
            <p class="challenge">Is this a Fair Test? Why or why not?</p>
        </div>
    </div>
</body>

</html>
