<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 720pt;
            height: 405pt;
            margin: 0;
            padding: 0;
            background-color: #F4F1DE;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            width: 720pt;
            padding: 15pt 0;
            background-color: #3A6B35;
            color: #F4F1DE;
        }

        h1 {
            margin: 0;
            font-size: 24pt;
            padding-left: 30pt;
        }

        .content {
            padding: 30pt;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rule-box {
            width: 600pt;
            background-color: #FFFFFF;
            padding: 30pt;
            border-radius: 15pt;
            border: 3pt dashed #3A6B35;
            text-align: center;
        }

        h2 {
            color: #3A6B35;
            font-size: 28pt;
            margin-top: 0;
        }

        p {
            font-size: 20pt;
            color: #2C2C2C;
            line-height: 1.4;
        }

        span {
            font-weight: bold;
            color: #E07A5F;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>What is a Fair Test?</h1>
    </div>
    <div class="content">
        <div class="rule-box">
            <h2>The Golden Rule</h2>
            <p>Change <span>ONE</span> variable,</p>
            <p>Measure <span>ONE</span> variable,</p>
            <p>Keep <span>EVERYTHING ELSE</span> the same!</p>
        </div>
    </div>
</body>

</html>
