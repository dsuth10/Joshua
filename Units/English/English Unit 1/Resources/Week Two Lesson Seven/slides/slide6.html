<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header { background: #112d4e; padding: 10pt; padding-left: 40pt; }
h1 { color: #f96d00; font-size: 32pt; margin: 0; }
.content { margin: 20pt 40pt; display: flex; flex-direction: row; gap: 20pt; }
.col { flex: 1; display: flex; flex-direction: column; }
.box {
  padding: 15pt; border-radius: 12pt; height: 180pt;
  display: flex; flex-direction: column; justify-content: center;
}
.dylan { background: #f96d00; color: white; }
.school { background: #dbe2ef; border: 3pt solid #112d4e; color: #112d4e; }
h2 { font-size: 24pt; margin: 0 0 10pt 0; text-align: center; }
p { font-size: 18pt; margin: 0; line-height: 1.3; text-align: center; font-style: italic; }
</style>
</head>
<body>
<div class="header">
  <h1>Dylan vs. The School (Code-Switching)</h1>
</div>
<div class="content">
  <div class="col">
    <div class="box dylan">
      <h2>Dylan</h2>
      <p>"G'day mate, how's it going? Chuck it in the back of the ute."</p>
    </div>
  </div>
  <div class="col">
    <div class="box school">
      <h2>The School</h2>
      <p>"Good morning students. Please place your belongings in the designated area."</p>
    </div>
  </div>
</div>
</body>
</html>
