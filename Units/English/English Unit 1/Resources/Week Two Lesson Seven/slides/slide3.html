<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header { background: #112d4e; padding: 10pt; padding-left: 40pt; }
h1 { color: #f96d00; font-size: 32pt; margin: 0; }
.content { margin: 20pt 40pt; display: flex; flex-direction: row; gap: 40pt; }
.col { flex: 1; display: flex; flex-direction: column; gap: 15pt; }
.box {
  background: #dbe2ef; padding: 10pt; border-left: 8pt solid #3f72af;
}
p { font-size: 20pt; color: #112d4e; margin: 0; }
.term { font-weight: bold; color: #f96d00; }
</style>
</head>
<body>
<div class="header">
  <h1>Exploring Aussie Slang</h1>
</div>
<div class="content">
  <div class="col">
    <p>In <i>Paper Planes</i>, Dylan and his community use a lot of Australian slang.</p>
    <div class="box">
      <p><span class="term">"Mate"</span> = A friend</p>
    </div>
    <div class="box">
      <p><span class="term">"Esky"</span> = Cooler</p>
    </div>
  </div>
  <div class="col">
    <div class="box" style="margin-top: 50pt;">
      <p><span class="term">"Fair dinkum"</span> = Honest / True</p>
    </div>
    <div class="box">
      <p><span class="term">"Bonza"</span> = Excellent</p>
    </div>
  </div>
</div>
</body>
</html>
