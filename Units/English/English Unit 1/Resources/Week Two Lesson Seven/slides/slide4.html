<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header { background: #112d4e; padding: 10pt; padding-left: 40pt; }
h1 { color: #f96d00; font-size: 32pt; margin: 0; }
.content { margin: 20pt 40pt; }
.box {
  background: #3f72af; padding: 15pt; border-radius: 12pt;
  margin-bottom: 15pt;
}
p { font-size: 22pt; color: #112d4e; margin: 0; line-height: 1.3; }
.box p { color: #ffffff; }
</style>
</head>
<body>
<div class="header">
  <h1>Why so much slang?</h1>
</div>
<div class="content">
  <div class="box">
    <p>Authors choose specific words for their characters to tell us more about them.</p>
  </div>
  
  <p>Think about these questions:</p>
  <ul style="font-size: 24pt; color: #112d4e; line-height: 1.5; margin-left: 20pt;">
    <li>Where does Dylan live?</li>
    <li>How close is the community?</li>
    <li>Are they formal people, or relaxed?</li>
  </ul>
</div>
</body>
</html>
