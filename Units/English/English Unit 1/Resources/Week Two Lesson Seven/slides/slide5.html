<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #112d4e;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.content { margin: 40pt; text-align: center; }
h1 { color: #f96d00; font-size: 50pt; margin-bottom: 30pt; font-weight: bold; }
p { color: #f9f7f7; font-size: 26pt; line-height: 1.5; }
.highlight { color: #3f72af; font-weight: bold; background: white; padding: 5pt 10pt; border-radius: 8pt; }
</style>
</head>
<body>
<div class="content">
  <h1>Why do we say 'Mate'?</h1>
  <p>In Australia, calling someone <span class="highlight">Mate</span> is a sign of </p>
  <p style="margin-top: 20pt;"><b>equality</b> and <b>friendship</b>.</p>
  <p style="margin-top: 30pt; font-size: 22pt;">It shows that nobody is "better" than anyone else.</p>
</div>
</body>
</html>
