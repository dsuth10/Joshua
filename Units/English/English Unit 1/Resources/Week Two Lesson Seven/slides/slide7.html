<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}
.header { background: #112d4e; padding: 20pt; padding-left: 40pt; }
h1 { color: #f96d00; font-size: 40pt; margin: 0; }
.content { margin: 20pt 40pt; }
.box {
  background: #3f72af; padding: 15pt; border-radius: 12pt;
  margin-bottom: 15pt;
}
p { font-size: 22pt; color: #112d4e; margin: 0; line-height: 1.3; }
.box p { color: #ffffff; }
.number { background: #f96d00; color: white; display: inline-block; width: 35pt; height: 35pt; line-height: 35pt; text-align: center; border-radius: 18pt; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
  <h1>Independent Work</h1>
</div>
<div class="content">
  <div class="box">
    <p>It's time to open your <b>Student Handout</b>.</p>
  </div>
  
  <p style="margin-bottom: 10pt;"><span class="number">1</span> &nbsp; Match the slang words in Part 1.</p>
  <p style="margin-bottom: 10pt;"><span class="number">2</span> &nbsp; Answer the Character Voice questions in Part 2.</p>
  <p><span class="number">3</span> &nbsp; Try your hand at "Code-Switching" in Part 3.</p>
</div>
</body>
</html>
