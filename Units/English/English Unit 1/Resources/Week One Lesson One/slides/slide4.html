<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
.header { background: #112d4e; padding: 15pt 40pt; }
h1 { color: #f96d00; font-size: 32pt; margin: 0; }
.content { padding: 15pt 40pt; display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; }
.box { background: #3f72af; padding: 12pt; border-radius: 12pt; color: white; text-align: center; }
.box i { font-size: 30pt; display: block; margin-bottom: 5pt; }
h3 { margin: 0 0 5pt 0; font-size: 18pt; color: #f96d00; }
p { font-size: 15pt; margin: 0; line-height: 1.2; }
.footer { height: 48pt; }
</style>
</head>
<body>
  <div class="header">
    <h1>Making Predictions</h1>
  </div>
  <div class="content">
    <div class="box">
      <i>👨‍👦</i>
      <h3>Family</h3>
      <p>How do Dylan and his dad get along?</p>
    </div>
    <div class="box">
      <i>🏆</i>
      <h3>Competition</h3>
      <p>Is Jason going to be a friend or a rival?</p>
    </div>
    <div class="box">
      <i>✨</i>
      <h3>Dreams</h3>
      <p>What does Dylan want more than anything?</p>
    </div>
    <div class="box">
      <i>🦅</i>
      <h3>Nature</h3>
      <p>Why does Dylan watch the eagles so closely?</p>
    </div>
  </div>
  <div class="footer"></div>
</body>
</html>
