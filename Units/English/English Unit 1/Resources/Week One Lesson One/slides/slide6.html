<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #112d4e; color: #f9f7f7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
.header { background: #f96d00; padding: 25pt; text-align: center; }
h1 { color: #112d4e; font-size: 40pt; margin: 0; }
.content { flex-grow: 1; padding: 20pt 40pt; text-align: center; }
.box { background: #3f72af; padding: 20pt; border-radius: 20pt; color: white; display: inline-block; }
p { font-size: 28pt; margin: 0 0 10pt 0; font-weight: bold; }
ul { text-align: left; font-size: 20pt; margin: 0 auto; display: inline-block; }
li { margin-bottom: 10pt; }
.footer { height: 48pt; background: #3f72af; }
</style>
</head>
<body>
  <div class="header">
    <h1>Ready to Read?</h1>
  </div>
  <div class="content">
    <div class="box">
      <p>Chapter 1: The Beginning</p>
      <ul>
        <li>Listen for descriptions of the wind.</li>
        <li>Watch how Dylan's dad reacts to him.</li>
        <li>Find one 'Aussie' word.</li>
      </ul>
    </div>
  </div>
  <div class="footer"></div>
</body>
</html>
