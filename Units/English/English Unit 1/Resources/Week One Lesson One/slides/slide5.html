<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
.header { background: #112d4e; padding: 15pt 40pt; }
h1 { color: #f96d00; font-size: 36pt; margin: 0; }
.content { padding: 30pt 40pt; display: flex; align-items: center; gap: 40pt; }
.map-text { flex: 1; }
.icon-box { background: #f96d00; color: white; padding: 30pt; border-radius: 50%; font-size: 60pt; }
p { color: #112d4e; font-size: 24pt; margin: 0 0 20pt 0; line-height: 1.4; }
.footer { height: 48pt; }
</style>
</head>
<body>
  <div class="header">
    <h1>Map Quest</h1>
  </div>
  <div class="content">
    <div class="map-text">
      <p>📍 Find <b>Western Australia</b> on your map.</p>
      <p>📍 Mark the location of <b>Perth</b>.</p>
      <p>📍 Imagine where <b>Waleup</b> might be hidden!</p>
    </div>
    <div class="icon-box"><p>🗺️</p></div>
  </div>
  <div class="footer"></div>
</body>
</html>
