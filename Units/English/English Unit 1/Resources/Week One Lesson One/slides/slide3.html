<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
.header { background: #112d4e; padding: 15pt 40pt; }
h1 { color: #f96d00; font-size: 36pt; margin: 0; }
.content { padding: 30pt 40pt; display: flex; gap: 30pt; }
.box { background: #3f72af; padding: 20pt; border-radius: 15pt; color: white; flex: 1; }
.text-side { flex: 1.5; }
p { color: #112d4e; font-size: 22pt; margin: 0 0 15pt 0; line-height: 1.4; }
.box p { color: white; font-weight: bold; margin-bottom: 10pt; }
.footer { height: 48pt; }
</style>
</head>
<body>
  <div class="header">
    <h1>Meet Dylan & Waleup</h1>
  </div>
  <div class="content">
    <div class="text-side">
      <p>Dylan lives in a small, remote town called <b>Waleup</b>.</p>
      <p>It's hot, dry, and a long way from the big city.</p>
      <p><i>Think: How would living here change your daily life?</i></p>
    </div>
    <div class="box">
      <p>Character Profile:</p>
      <p>Name: Dylan Webber</p>
      <p>Home: Waleup, WA</p>
      <p>Passion: ???</p>
    </div>
  </div>
  <div class="footer"></div>
</body>
</html>
