<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header { background: #112d4e; padding: 15pt 40pt; }
h1 { color: #f96d00; font-size: 32pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 25pt 40pt; }
.box { background: #3f72af; padding: 20pt; border-radius: 15pt; color: white; margin-bottom: 15pt; }
.box h2 { margin: 0 0 10pt 0; font-size: 24pt; }
p { color: #112d4e; font-size: 20pt; line-height: 1.4; margin: 0 0 10pt 0; }
ul { margin: 0; padding-left: 25pt; }
li { color: #112d4e; font-size: 18pt; margin-bottom: 8pt; line-height: 1.3; }
.footer { height: 40pt; }
</style>
</head>
<body>
  <div class="header"><h1>What is Context?</h1></div>
  <div class="content">
    <div class="box">
      <h2>Social & Cultural Context</h2>
      <p style="color:white; margin:0">The environment, location, and social status that surrounds a character.</p>
    </div>
    <p>It includes:</p>
    <ul>
      <li><b>Location:</b> Where they live.</li>
      <li><b>Resources:</b> What they own or can use.</li>
      <li><b>Social Standing:</b> How they are seen by others.</li>
    </ul>
  </div>
  <div class="footer"></div>
</body>
</html>
