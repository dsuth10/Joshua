<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header { background: #112d4e; padding: 12pt 40pt; }
h1 { color: #f96d00; font-size: 30pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 25pt 40pt; }
.box { background: #3f72af; padding: 20pt; border-radius: 12pt; color: white; display: flex; gap: 20pt; align-items: center; margin-bottom: 20pt; }
.box h2 { color: #f96d00; font-size: 28pt; margin: 0; }
p { color: #112d4e; font-size: 20pt; line-height: 1.4; margin: 0; }
ul { margin: 15pt 0 0 0; padding-left: 25pt; }
li { color: #112d4e; font-size: 20pt; margin-bottom: 10pt; line-height: 1.4; }
.placeholder { width: 220pt; height: 130pt; background: #ddd; display: flex; align-items: center; justify-content: center; border-radius: 10pt; color: #666; font-size: 16pt; text-align: center; padding: 5pt; }
</style>
</head>
<body>
  <div class="header"><h1>Jason: Economic Capital</h1></div>
  <div class="content">
    <div class="box">
      <div class="placeholder">Wind Tunnel / High-Tech Lab</div>
      <div>
        <h2>Access & Wealth</h2>
        <p style="color:white; margin-top:5pt;">Jason has money, the best planes, and professional wind tunnels for testing.</p>
      </div>
    </div>
    <ul>
      <li>Is having the best gear the same as being the best flier?</li>
    </ul>
  </div>
  <div class="footer" style="height:30pt"></div>
</body>
</html>
