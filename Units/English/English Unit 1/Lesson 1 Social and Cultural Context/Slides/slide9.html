<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header { background: #112d4e; padding: 12pt 40pt; }
h1 { color: #f96d00; font-size: 30pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 30pt 40pt; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.box { border: 3pt solid #f96d00; padding: 25pt; border-radius: 20pt; width: 85%; }
h2 { color: #112d4e; font-size: 28pt; margin: 0; }
p { color: #112d4e; font-size: 20pt; line-height: 1.4; margin-top: 15pt; }
</style>
</head>
<body>
  <div class="header"><h1>Discussion</h1></div>
  <div class="content">
    <div class="box">
      <h2>Is it a Level Playing Field?</h2>
      <p>Does having more money make the best plane, or does the person "throwing the plane" matter more?</p>
      <p style="font-style: italic; font-size: 18pt; margin-top: 20pt;">What does Steve Worland want us to believe?</p>
    </div>
  </div>
  <div class="footer" style="height:30pt"></div>
</body>
</html>
