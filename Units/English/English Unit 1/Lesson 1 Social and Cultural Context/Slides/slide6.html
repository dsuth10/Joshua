<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header { background: #112d4e; padding: 12pt 40pt; }
h1 { color: #f96d00; font-size: 30pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 20pt 40pt; }
table { width: 100%; border-collapse: collapse; margin-top: 5pt; }
th { background: #112d4e; color: #f9f7f7; font-size: 20pt; padding: 10pt; border: 1pt solid #112d4e; }
td { border: 1pt solid #112d4e; padding: 10pt; font-size: 18pt; color: #112d4e; vertical-align: top; }
</style>
</head>
<body>
  <div class="header"><h1>Waleup vs. Tokyo</h1></div>
  <div class="content">
    <table>
      <thead>
        <tr><th>Feature</th><th>Waleup</th><th>Tokyo</th></tr>
      </thead>
      <tbody>
        <tr><td><b>Landscape</b></td><td>Dry, dusty, vast.</td><td>Neon, crowded, urban.</td></tr>
        <tr><td><b>People</b></td><td>Small community, everyone knows everyone.</td><td>Global stage, millions of strangers.</td></tr>
        <tr><td><b>Feel</b></td><td>Quiet and slow.</td><td>Loud and fast.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="footer" style="height:30pt"></div>
</body>
</html>
