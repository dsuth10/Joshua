<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header { background: #112d4e; padding: 15pt 40pt; }
h1 { color: #f96d00; font-size: 32pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 30pt 40pt; display: flex; gap: 30pt; }
.text { flex: 1.2; }
.placeholder { flex: 1; background: #ddd; display: flex; align-items: center; justify-content: center; border-radius: 15pt; font-size: 20pt; color: #666; text-align: center; padding: 10pt; }
ul { margin: 0; padding-left: 20pt; }
li { color: #112d4e; font-size: 20pt; margin-bottom: 12pt; line-height: 1.4; }
</style>
</head>
<body>
  <div class="header"><h1>Tokyo: Global Context</h1></div>
  <div class="content">
    <div class="placeholder">Tokyo Skyline at Night</div>
    <div class="text">
      <ul>
        <li><b>Setting:</b> Neon, crowded, fast.</li>
        <li><b>Vibe:</b> High-tech, international.</li>
        <li><b>Impact:</b> Dylan is an "outsider" in a big, modern world.</li>
      </ul>
    </div>
  </div>
  <div class="footer" style="height:40pt"></div>
</body>
</html>
