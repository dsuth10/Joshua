<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header {
  background: #112d4e;
  padding: 12pt 40pt;
  display: flex;
  align-items: center;
}
h1 { 
  color: #f96d00;
  font-size: 32pt; 
  margin: 0; 
  font-weight: bold;
}
.content {
  flex: 1;
  padding: 20pt 40pt;
  display: flex;
  flex-direction: column;
  gap: 15pt;
}
.box {
  background: #3f72af;
  padding: 15pt;
  border-radius: 12pt;
  color: white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
p {
  color: #112d4e;
  font-size: 22pt;
  margin: 0;
  line-height: 1.3;
}
.box p { color: #ffffff; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20pt;
}
.highlight {
  color: #f96d00;
  font-weight: bold;
}
.footer {
  height: 50pt;
  background: transparent;
}
ul { margin: 0; padding-left: 25pt; }
li { font-size: 18pt; color: #112d4e; margin-bottom: 5pt; }
</style>
</head>
<body>
  <div class="header">
    <h1>Soaring with Sentences</h1>
  </div>
  
  <div class="content">
    <div class="box" style="margin-top: 30pt; text-align: center;"><p>Mastering <span class="highlight">Compound</span> and <span class="highlight">Complex</span> Sentences</p><p style="font-size: 18pt;">Year 5 English: Unit 1 Study</p></div>
  </div>

  <div class="footer"></div>
</body>
</html>
