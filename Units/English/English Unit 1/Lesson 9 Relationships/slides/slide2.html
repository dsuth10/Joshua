<!DOCTYPE html>
<html>
<head>
<style>
  html { background: #ffffff; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #e1f5fe; font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    position: relative;
  }
  .motif {
    position: absolute; top: 10pt; right: 20pt; width: 60pt; height: 60pt;
    background: white; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 0); opacity: 0.4;
  }
  .header { background: #ffffff; padding: 15pt 40pt; border-bottom: 4pt solid #03a9f4; }
  h1 { color: #0277bd; font-size: 28pt; margin: 0; font-weight: 800; }
  .content { flex: 1; padding: 25pt 40pt; display: flex; flex-direction: column; gap: 15pt; }
  .box { background: white; padding: 15pt; border-radius: 10pt; border-left: 8pt solid #f44336; }
  p { color: #01579b; font-size: 18pt; margin: 0; line-height: 1.4; }
  .task-box { background: #fff3e0; padding: 15pt; border-radius: 10pt; border: 2pt dashed #ff9800; }
  .highlight { color: #f44336; font-weight: bold; }
</style>
</head>
<body>
  <div class="motif"></div>
  <div class="header"><h1>Early Tension: Dylan & Jack</h1></div>
  <div class="content">
    <div class="box">
      <p><span class="highlight">Atmosphere in Waleup:</span> "The house was often dark, even when the sun was still up."</p>
    </div>
    <div class="task-box">
      <p><strong>Discussion Questions:</strong></p>
      <ul>
        <li>Why does Jack stay in the dark?</li>
        <li>What does Dylan do to 'prop up' his father?</li>
        <li>How does the silence feel in their home?</li>
      </ul>
    </div>
  </div>
</body>
</html>
