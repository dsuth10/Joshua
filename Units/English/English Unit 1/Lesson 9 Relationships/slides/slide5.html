<!DOCTYPE html>
<html>
<head>
<style>
  html { background: #ffffff; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #e1f5fe; font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    position: relative;
  }
  .header { background: #ffffff; padding: 15pt 40pt; border-bottom: 4pt solid #01579b; }
  h1 { color: #01579b; font-size: 28pt; margin: 0; font-weight: 800; }
  .content { flex: 1; padding: 25pt 40pt; display: flex; flex-direction: column; gap: 15pt; }
  .box { background: white; padding: 15pt; border-radius: 10pt; border-left: 8pt solid #01579b; }
  p { color: #01579b; font-size: 18pt; margin: 0; line-height: 1.4; }
  .task-box { background: #e3f2fd; padding: 15pt; border-radius: 10pt; border: 2pt solid #01579b; }
  .highlight { color: #d32f2f; font-weight: bold; }
</style>
</head>
<body>
  <div class="header"><h1>Grandfather's Influence</h1></div>
  <div class="content">
    <div class="box">
      <p>"He didn't just teach me how to fold planes. He taught me why it mattered."</p>
    </div>
    <div class="task-box">
      <p><span class="highlight">Discussion:</span> How is Grandpa's home different from Dylan's home?</p>
      <ul>
        <li>Think about the light, the snacks, and the storytelling.</li>
        <li>How does Grandpa's energy affect Dylan's confidence?</li>
      </ul>
    </div>
  </div>
</body>
</html>
