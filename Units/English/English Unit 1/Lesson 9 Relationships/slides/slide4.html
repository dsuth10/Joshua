<!DOCTYPE html>
<html>
<head>
<style>
  html { background: #ffffff; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #e1f5fe; font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    position: relative;
  }
  .header { background: #ffffff; padding: 15pt 40pt; border-bottom: 4pt solid #ff9800; }
  h1 { color: #e65100; font-size: 28pt; margin: 0; font-weight: 800; }
  .content { flex: 1; padding: 25pt 40pt; display: flex; flex-direction: column; gap: 15pt; }
  .box { background: white; padding: 15pt; border-radius: 10pt; border-left: 8pt solid #ff9800; }
  p { color: #e65100; font-size: 18pt; margin: 0; line-height: 1.4; }
  .bullet-box { background: #fff3e0; padding: 15pt; border-radius: 10pt; }
  li { color: #e65100; font-size: 18pt; margin-bottom: 10pt; }
</style>
</head>
<body>
  <div class="header"><h1>The "Eagle Video" Symbol</h1></div>
  <div class="content">
    <div class="box">
      <p>Jack spends hours watching a low-quality video of an eagle in flight.</p>
    </div>
    <div class="bullet-box">
      <ul>
        <li>What does the eagle represent for Jack?</li>
        <li>Why does he watch it instead of talking to Dylan?</li>
        <li>How does this video link to the theme of "Flight"?</li>
      </ul>
    </div>
  </div>
</body>
</html>
