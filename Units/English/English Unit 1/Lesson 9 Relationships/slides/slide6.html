<!DOCTYPE html>
<html>
<head>
<style>
  html { background: #ffffff; }
  body {
    width: 720pt; height: 405pt; margin: 0; padding: 0;
    background: #e1f5fe; font-family: 'Segoe UI', Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    position: relative;
  }
  .header { background: #ffffff; padding: 15pt 40pt; border-bottom: 4pt solid #9c27b0; }
  h1 { color: #4a148c; font-size: 28pt; margin: 0; font-weight: 800; }
  .content { flex: 1; padding: 25pt 40pt; display: flex; flex-direction: column; gap: 15pt; }
  .box { background: white; padding: 15pt; border-radius: 10pt; }
  p { color: #4a148c; font-size: 24pt; margin: 0; text-align: center; font-weight: bold; }
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20pt; }
  .side { background: #f3e5f5; padding: 15pt; border-radius: 10pt; }
  h2 { font-size: 18pt; margin-top: 0; }
  li { font-size: 16pt; margin-bottom: 5pt; }
</style>
</head>
<body>
  <div class="header"><h1>Summary: Compare & Contrast</h1></div>
  <div class="content">
    <div class="summary-grid">
      <div class="side">
        <h2>Father (Jack)</h2>
        <ul>
          <li>Grief and silence.</li>
          <li>Emotional distance.</li>
          <li>"Stuck on the ground."</li>
        </ul>
      </div>
      <div class="side">
        <h2>Grandfather</h2>
        <ul>
          <li>Storytelling and light.</li>
          <li>Active encouragement.</li>
          <li>"Providing the wind."</li>
        </ul>
      </div>
    </div>
    <div class="box">
      <p>Now, write your paragraph!</p>
    </div>
  </div>
</body>
</html>
