<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header {
  background: #112d4e;
  padding: 15pt 40pt;
  display: flex;
  align-items: center;
}
h1 { 
  color: #f96d00;
  font-size: 36pt; 
  margin: 0; 
  font-weight: bold;
}
.content {
  flex: 1;
  padding: 20pt 40pt;
  display: flex;
  flex-direction: column;
  gap: 15pt;
  justify-content: center;
  align-items: center;
}
.box {
  background: #112d4e;
  padding: 20pt;
  border-radius: 15pt;
  color: white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  text-align: center;
}
p {
  color: #112d4e;
  font-size: 24pt;
  margin: 0;
  line-height: 1.4;
}
.box p { color: #ffffff; }
.footer { height: 48pt; background: transparent; }
</style>
</head>
<body>
  <div class="header">
    <h1>Review & Reflect</h1>
  </div>
  
  <div class="content">
    <div class="box">
      <p style="font-size: 28pt; font-weight: bold; color: #f96d00;">Can you identify an authoritative source?</p>
    </div>
    <p style="margin-top: 20pt; font-size: 22pt;">Why is it important to move beyond bare assertions when writing informative texts?</p>
  </div>

  <div class="footer"></div>
</body>
</html>
