<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header {
  background: #112d4e;
  padding: 15pt 40pt;
  display: flex;
  align-items: center;
}
h1 { 
  color: #f96d00;
  font-size: 36pt; 
  margin: 0; 
  font-weight: bold;
}
.content {
  flex: 1;
  padding: 20pt 40pt;
  display: flex;
  flex-direction: column;
  gap: 15pt;
}
.box {
  background: #3f72af;
  padding: 15pt;
  border-radius: 15pt;
  color: white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
p {
  color: #112d4e;
  font-size: 20pt;
  margin: 0;
  line-height: 1.4;
}
.box p { color: #ffffff; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30pt;
  margin-top: 20pt;
}
.highlight {
  color: #f96d00;
  font-weight: bold;
}
.footer { height: 48pt; background: transparent; }
</style>
</head>
<body>
  <div class="header">
    <h1>Activate: Assertion vs. Supported Claim</h1>
  </div>
  
  <div class="content">
    <div class="grid">
      <div class="box" style="background: #e0e0e0; color: #112d4e;">
        <p style="color: #112d4e; font-weight: bold;">Bare Assertion</p>
        <p style="color: #112d4e; font-size: 18pt; margin-top: 10pt;">"Floods are very dangerous and kill many people."</p>
      </div>
      <div class="box">
        <p style="font-weight: bold;">Supported Claim</p>
        <p style="font-size: 18pt; margin-top: 10pt;">"Floods claimed 35 lives in Queensland in 2011, according to the Queensland Government Flood Commission."</p>
      </div>
    </div>
    <p style="margin-top: 20pt; text-align: center;">What makes the second sentence <span class="highlight">stronger and more reliable</span>?</p>
  </div>

  <div class="footer"></div>
</body>
</html>
