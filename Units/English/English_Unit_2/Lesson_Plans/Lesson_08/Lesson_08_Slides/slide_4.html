<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 20pt 40pt; background: #112d4e; font-family: Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
h1 { color: #f96d00; font-size: 36pt; margin: 0 0 10pt 0; text-align: center; }
.divider { height: 2pt; background-color: #3f72af; width: 100%; margin-bottom: 20pt; }
p, li { color: #f9f7f7; font-size: 22pt; line-height: 1.4; }
.example-box { background: #193a61; padding: 15pt; border-radius: 10pt; border: 2pt solid #3f72af; margin-top: 15pt; }
.formal { color: #f9f7f7; font-weight: bold; }
.informal { color: #f96d00; font-weight: bold; }
</style>
</head>
<body>
  <h1>Formal vs. Informal Register</h1>
  <div class="divider"></div>
  <p>The situation we are in changes the language we choose. This is called the <span style="color: #f96d00; font-weight: bold;">social context</span>.</p>
  <div class="example-box">
    <p><span class="formal">Formal:</span> "The residence was structurally compromised by the extreme weather event."</p>
    <p style="margin-top: 15pt;"><span class="informal">Informal:</span> "My house got totally smashed by the storm."</p>
  </div>
</body>
</html>
