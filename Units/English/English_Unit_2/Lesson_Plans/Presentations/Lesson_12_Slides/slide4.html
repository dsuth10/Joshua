<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: Arial, sans-serif; width: 720pt; height: 405pt; margin: 0; padding: 0; overflow: hidden; }
        .slide { width: 100%; height: 100%; padding: 40pt; box-sizing: border-box; background-color: white; color: #1C2833; }
        h2 { font-size: 28pt; color: #2E4053; margin: 0; }
        .example-box { border: 3pt solid #1C2833; padding: 20pt; margin-top: 30pt; border-radius: 12pt; text-align: center; }
        p { margin: 0; font-size: 32pt; }
        .theme { color: #0000FF; font-weight: bold; }
        .rheme { color: #FF0000; font-weight: bold; }
        .labels { display: grid; grid-template-columns: 1fr 1fr; gap: 20pt; margin-top: 20pt; text-align: center; }
        .label-title { font-size: 20pt; font-weight: bold; margin-bottom: 5pt; }
        .label-text { font-size: 14pt; color: #1C2833; }
    </style>
</head>
<body>
    <div class="slide">
        <h2>Concept: Theme and Rheme</h2>
        <div class="example-box">
            <p><span class="theme">The floodwaters</span> <span class="rheme">rose quickly.</span></p>
        </div>
        <div class="labels">
            <div style="color: #0000FF;">
                <div class="label-title"><p>THEME</p></div>
                <div class="label-text"><p>The starting point.<br>What the message is about.</p></div>
            </div>
            <div style="color: #FF0000;">
                <div class="label-title"><p>RHEME</p></div>
                <div class="label-text"><p>The new information.<br>What we learn about the theme.</p></div>
            </div>
        </div>
    </div>
</body>
</html>
