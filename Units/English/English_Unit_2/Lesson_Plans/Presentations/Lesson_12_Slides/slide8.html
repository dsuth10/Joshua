<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: Arial, sans-serif; width: 720pt; height: 405pt; margin: 0; padding: 0; overflow: hidden; }
        .slide { width: 100%; height: 100%; padding: 40pt; box-sizing: border-box; background-color: white; color: #1C2833; }
        h2 { font-size: 28pt; color: #2E4053; margin: 0; }
        .example { margin-top: 25pt; }
        p { margin: 0; font-size: 20pt; }
        .original { color: #AAB7B8; text-decoration: line-through; }
        .rewrite { margin-top: 15pt; border-left: 5pt solid #0000FF; padding: 10pt; background: #EBF5FB; font-weight: bold; }
    </style>
</head>
<body>
    <div class="slide">
        <h2>Modelling: Rewriting for Emphasis</h2>
        <div class="example">
            <p class="original">Fast-moving water is deceptive and lethal.</p>
            <p style="font-size: 16pt; margin-top: 10pt; color: #2E4053;">Goal: Emphasise the <b>reason</b> for the danger.</p>
            <div class="rewrite">
                <p><span style="color: #0000FF;">Because it is so deceptive</span>, fast-moving water can be lethal.</p>
            </div>
        </div>
        <p style="font-size: 16pt; margin-top: 30pt;">By starting with <b>"Because..."</b>, we tell the reader why it's dangerous before we tell them what the danger is.</p>
    </div>
</body>
</html>
