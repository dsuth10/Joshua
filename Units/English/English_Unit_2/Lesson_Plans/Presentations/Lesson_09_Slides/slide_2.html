<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header { background: #112d4e; padding: 15pt 40pt; display: flex; align-items: center; }
h1 { color: #f96d00; font-size: 36pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 30pt 40pt; display: flex; flex-direction: column; gap: 20pt; }
.box { background: #3f72af; padding: 20pt; border-radius: 15pt; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
p { color: #112d4e; font-size: 24pt; margin: 0; line-height: 1.4; }
.box p { color: #ffffff; }
.highlight { color: #f96d00; font-weight: bold; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30pt; }
.footer { height: 48pt; background: transparent; }
</style>
</head>
<body>
  <div class="header">
    <h1>What makes a sentence?</h1>
  </div>
  <div class="content">
    <div class="grid">
      <div>
        <p><strong>Simple Sentence</strong></p>
        <div class="box" style="margin-top: 15pt;">
          <p>Floodwaters rose quickly.</p>
        </div>
        <p style="margin-top: 15pt; font-size: 20pt;">One main clause. Makes sense on its own.</p>
      </div>
      <div>
        <p><strong>Compound Sentence</strong></p>
        <div class="box" style="margin-top: 15pt; background: #112d4e;">
          <p>The rain stopped, <span class="highlight">but</span> the river kept rising.</p>
        </div>
        <p style="margin-top: 15pt; font-size: 20pt;">Two main clauses joined by a conjunction (and, but, so).</p>
      </div>
    </div>
  </div>
  <div class="footer"></div>
</body>
</html>
