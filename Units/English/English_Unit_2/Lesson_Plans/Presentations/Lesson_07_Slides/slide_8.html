<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #f9f7f7; font-family: Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
.header { background: #112d4e; padding: 15pt 40pt; display: flex; align-items: center; }
h1 { color: #f96d00; font-size: 36pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 30pt 40pt; display: flex; flex-direction: column; gap: 20pt; justify-content: center; align-items: center; text-align: center; }
.box { background: #3f72af; padding: 25pt; border-radius: 15pt; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; }
p { color: #112d4e; font-size: 24pt; margin: 0; line-height: 1.4; }
.box p { color: #ffffff; }
.highlight { color: #f96d00; font-weight: bold; }
.footer { height: 48pt; background: transparent; }
</style>
</head>
<body>
  <div class="header">
    <h1>Your Turn: Fact Finding</h1>
  </div>
  <div class="content">
    <p>Open the <span class="highlight">Cyclone Mahina</span> Archive page.</p>
    <div class="box">
      <p>Find <span class="highlight">three facts</span> about the impacts of Cyclone Mahina.</p>
    </div>
    <p style="font-size: 18pt; margin-top:0pt;">Remember to record: The fact, the strategy you used (Skim/Scan/Confirm), and where you found it (Heading name).</p>
  </div>
  <div class="footer"></div>
</body>
</html>
