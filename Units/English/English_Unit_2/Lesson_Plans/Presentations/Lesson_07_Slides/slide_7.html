<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #f9f7f7; font-family: Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
.header { background: #112d4e; padding: 15pt 40pt; display: flex; align-items: center; }
h1 { color: #f96d00; font-size: 36pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 20pt 40pt; display: flex; flex-direction: row; gap: 20pt; align-items: center; }
.web-snippet { background: #ffffff; border: 1px solid #cbd5e1; padding: 20pt; width: 55%; box-shadow: 0 10px 15px rgba(0,0,0,0.1); border-radius: 8pt; }
.web-heading { font-family: 'Times New Roman', serif; font-size: 26pt; font-weight: bold; margin: 0 0 10pt 0; color: #0f172a; }
.web-text { font-family: 'Times New Roman', serif; font-size: 16pt; color: #334155; line-height: 1.5; margin: 0; }
.web-highlight { background-color: #bbf7d0; padding: 2pt 4pt; border-radius: 4pt; font-weight: bold; }
.teacher-box { background: #f96d00; padding: 20pt; border-radius: 15pt; width: 45%; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
.teacher-box p { font-size: 24pt; margin: 0; line-height: 1.4; color: #ffffff; font-weight: bold; font-style: italic; }
.footer { height: 48pt; background: transparent; }
</style>
</head>
<body>
  <div class="header">
    <h1>Model Confirming</h1>
  </div>
  <div class="content">
    <div class="web-snippet">
      <p class="web-text">...What is not speculation is the storm surge. <span class="web-highlight">The wave recorded in the aftermath reached 13 metres above normal sea level</span> &mdash; a world record that still stands today.</p>
    </div>
    <div class="teacher-box">
      <p>"Did I confirm the height of the storm surge?"</p>
    </div>
  </div>
  <div class="footer"></div>
</body>
</html>
