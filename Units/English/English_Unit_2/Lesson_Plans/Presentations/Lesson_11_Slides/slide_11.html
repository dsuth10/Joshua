<!DOCTYPE html>
<html>
<head>
<style>
* { box-sizing: border-box; }
html, body { width: 720pt; height: 405pt; margin: 0; padding: 0; overflow: hidden; background: #ffffff; }
body { 
    background-color: #003366; 
    font-family: Arial, sans-serif; color: white;
}
.slide-padding {
    padding: 55pt; /* ~0.76 inch padding for safety */
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: flex-start;
}
.header-bar { border-left: 8pt solid #00ccff; padding-left: 20pt; margin-bottom: 20pt; flex-shrink: 0; }
h1 { font-size: 34pt; margin: 0; font-weight: bold; text-transform: uppercase; letter-spacing: 2pt; line-height: 1.1; }
.content { font-size: 24pt; line-height: 1.3; width: 100%; flex-grow: 1; overflow: hidden; }
.vocabulary-box { background: rgba(255,255,255,0.1); border-radius: 12pt; padding: 15pt; margin-top: 10pt; border: 1pt solid rgba(255,255,255,0.2); }
.term { color: #00ccff; font-weight: bold; }
ul { list-style-type: none; padding: 0; margin: 0; }
li { margin-bottom: 6pt; display: flex; align-items: flex-start; }
li:before { content: "•"; color: #00ccff; font-size: 30pt; margin-right: 15pt; line-height: 0.8; }
</style>
</head>
<body>
  <div class="slide-padding">
    <div class="header-bar">
      <h1>Core Term: Riverine</h1>
    </div>
    <div class="content">
      <div class='vocabulary-box'><p><span class='term'>Riverine:</span> Relating to or situated on the banks of a river.</p><p style='font-size:20pt;'>Found in: How Floods Work (Riverine Flooding)</p></div>
    </div>
  </div>
</body>
</html>
