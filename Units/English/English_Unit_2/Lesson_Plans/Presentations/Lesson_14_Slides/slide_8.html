<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            box-sizing: border-box; 
            padding: 40pt; 
            width: 720pt; 
            height: 405pt; 
            background: #112d4e; 
            color: #f9f7f7; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            overflow: hidden;
        }
        .container { width: 90%; }
        h1 { font-size: 40pt; color: #f96d00; margin: 0 0 15pt 0; font-weight: bold; }
        .divider { height: 4pt; background-color: #3f72af; width: 120pt; margin: 0 auto 25pt auto; border-radius: 2pt; }
        p.desc { font-size: 22pt; color: #f9f7f7; margin: 0 0 25pt 0; line-height: 1.4; }
        .badge { background: #f96d00; padding: 12pt 25pt; border-radius: 30pt; display: inline-block; }
        .badge p { margin: 0; color: #ffffff; font-size: 18pt; font-weight: bold; text-transform: uppercase; letter-spacing: 1pt; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Consolidation</h1>
        <div class="divider"></div>
        <p class="desc">Share your written analysis with a peer.<br>Did you explain the <b>effect on meaning</b>?</p>
        <div class="badge"><p>Exit Ticket: Complete Forms Assessment</p></div>
    </div>
</body>
</html>
