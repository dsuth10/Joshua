<body>
  <div class="header"><h1>&#128256; Activate: Put These in Order</h1></div>
  <p class="question">These three descriptions show Brisbane flooding. Can you work out the correct chronological order? Think-Pair-Share!</p>
  <table>
    <tr>
      <td><strong>A</strong>2022<em>900+ homes in 48 hours</em></td>
      <td><strong>B</strong>1974<em>6,700 homes flooded</em></td>
      <td><strong>C</strong>2011<em>12,500 properties inundated</em></td>
    </tr>
  </table>
  <p class="hint">Which happened first? Which happened last? How do you know?</p>
