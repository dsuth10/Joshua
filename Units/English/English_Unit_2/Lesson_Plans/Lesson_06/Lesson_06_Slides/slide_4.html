<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #f9f7f7; font-family: Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
.header { background: #112d4e; padding: 15pt 40pt; display: flex; align-items: center; }
h1 { color: #f96d00; font-size: 36pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 15pt 40pt; display: grid; grid-template-columns: 1fr 1fr; gap: 20pt; }
.box { background: #3f72af; padding: 10pt; border-radius: 10pt; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 10pt;}
p { color: #112d4e; font-size: 16pt; margin: 0; line-height: 1.3; }
.box p { color: #ffffff; }
.highlight { color: #f96d00; font-weight: bold; }
.img-container { display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #ccc; padding: 5px; border-radius: 10px;}
img { max-width: 100%; max-height: 180pt; object-fit: contain; }
.footer { height: 48pt; background: transparent; }
</style>
</head>
<body>
  <div class="header">
    <h1>Structure 2: Timelines</h1>
  </div>
  <div class="content">
    <div class="img-container">
      <img src="file:///c:/Users/dsuth/Documents/Joshua/Units/English/English_Unit_2/Cyclones/Screenshots/timeline.png" alt="Screenshot of Timeline" />
    </div>
    <div>
      <div class="box">
        <p><strong>Description:</strong> A chronological list of events placed in a sidebar or ordered list.</p>
      </div>
      <div class="box" style="background:#112d4e;">
        <p><strong><span class="highlight">Why is it used?</span></strong><br/>Timelines condense a sequence of events into an easy-to-read format, helping the reader understand cause-and-effect and chronological order.</p>
      </div>
    </div>
  </div>
  <div class="footer"></div>
</body>
</html>
