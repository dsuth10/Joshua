<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body { width: 720pt; height: 405pt; margin: 0; padding: 0; background: #f9f7f7; font-family: Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
.header { background: #112d4e; padding: 15pt 40pt; display: flex; align-items: center; }
h1 { color: #f96d00; font-size: 36pt; margin: 0; font-weight: bold; }
.content { flex: 1; padding: 20pt 40pt; display: flex; flex-direction: column; gap: 15pt; }
.box { background: #3f72af; padding: 20pt; border-radius: 15pt; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
p { color: #112d4e; font-size: 22pt; margin: 0; line-height: 1.4; }
.box p { color: #ffffff; font-size: 24pt; font-weight: bold; }
ul { font-size: 20pt; color: #112d4e; line-height: 1.5; margin-top: 10pt; }
.highlight { color: #f96d00; font-weight: bold; }
.footer { height: 48pt; background: transparent; }
</style>
</head>
<body>
  <div class="header">
    <h1>What is Confirming?</h1>
  </div>
  <div class="content">
    <div class="box">
      <p>Slowing down to read carefully and check.</p>
    </div>
    <p>Like digging up the treasure, this is when you stop and read.</p>
    <ul>
      <li>Once you scan and find your keyword, <span class="highlight">stop</span>.</li>
      <li>Read the <span class="highlight">whole sentence</span>.</li>
      <li>Does it actually answer your question or give you the right fact?</li>
    </ul>
  </div>
  <div class="footer"></div>
</body>
</html>
