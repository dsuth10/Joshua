<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f7f7; color: #333333; margin: 0; padding: 40px 60px; display: flex; flex-direction: column; justify-content: flex-start; height: 100vh; box-sizing: border-box; }
  h1 { color: #112d4e; font-size: 56px; border-bottom: 4px solid #f96d00; padding-bottom: 10px; margin-bottom: 20px; }
  .content { font-size: 28px; line-height: 1.4; }
  .example { background-color: #e0e0e0; padding: 20px; border-left: 8px solid #f96d00; margin-top: 20px; font-style: italic; }
  .navy { color: #112d4e; font-weight: bold; }
</style>
</head>
<body>
  <h1>Model: Structuring Our Report</h1>
  <div class="content">
    <p>Let's look at how we might plan a report on <span class="navy">Tsunamis</span>.</p>
    <div class="example">
      <p>"First, I need my <span style="color: #3f72af; font-weight: bold;">general statement</span> to introduce what a tsunami is."</p>
      <p style="margin-top: 15px;">"Then, I'll need some facts about the <span style="color: #3f72af; font-weight: bold;">physical science</span> behind it... like underwater earthquakes."</p>
    </div>
  </div>
</body>
</html>
