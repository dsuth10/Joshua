<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f7f7; color: #333333; margin: 0; padding: 40px 60px; display: flex; flex-direction: column; justify-content: flex-start; height: 100vh; box-sizing: border-box; }
  h1 { color: #112d4e; font-size: 56px; border-bottom: 4px solid #f96d00; padding-bottom: 10px; margin-bottom: 20px; }
  .content { font-size: 28px; line-height: 1.4; }
  .highlight { color: #f96d00; font-weight: bold; }
  ul { margin-top: 10px; }
  li { margin-bottom: 10px; }
</style>
</head>
<body>
  <h1>Learning Intention</h1>
  <div class="content">
    <p>I can <span class="highlight">plan an information report</span> using structural features modelled on the Bushfires Archive.</p>
    <p style="color: #3f72af; font-weight: bold; font-size: 32px; margin: 20px 0 0 0;">Success Criteria:</p>
    <ul>
      <li>I can choose a natural disaster topic.</li>
      <li>I can use a planning scaffold to organize my ideas.</li>
      <li>I can include at least 3 researched facts in my plan.</li>
    </ul>
  </div>
</body>
</html>
