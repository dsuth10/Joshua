<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A local Year 5 end-of-term learning activity."><title>Great Neighbourhood Film Festival</title><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>Great Neighbourhood Film Festival</h1><p>Plan a festival that works for people, place and power.</p></header>
<main><div class="toolbar"><div class="identity"><label for="username">Student username</label><input id="username" autocomplete="off" maxlength="32" aria-describedby="username-help"><span id="username-help" class="small">Use a nickname only. Do not use your full name.</span></div><div class="actions"><button id="download" class="secondary">Download checkpoint</button><label class="secondary" style="padding:.7rem 1rem;border-radius:10px;font-weight:700;cursor:pointer">Import checkpoint<input id="import" type="file" accept="application/json" class="hidden"></label><button id="reset" class="danger">Start again</button></div></div><p id="save-status" class="small" aria-live="polite"></p><div id="app"></div></main>
<dialog id="approval-dialog"><article><h2>Teacher approval</h2><p id="approval-summary"></p><div id="approval-work"></div><label for="teacher-note">Changes requested (optional note)</label><textarea id="teacher-note" placeholder="What should the student improve?"></textarea><div class="actions"><button id="request-changes" class="secondary">Request changes</button><button id="open-pin">Approve with PIN</button><button id="close-approval" class="secondary">Close</button></div><div id="pin-area" class="hidden"><label for="pin">Teacher PIN</label><input id="pin" inputmode="numeric" type="password" autocomplete="off"><p id="pin-message" class="small" aria-live="polite"></p><button id="confirm-pin">Approve this mission</button></div></article></dialog>
<dialog id="film-dialog"><article class="screening"><h2 id="film-title">Your film</h2><video id="film" controls preload="metadata"><p>Your browser cannot play this video.</p></video><p id="film-status" class="small"></p><button id="close-film" class="secondary">Return to missions</button></article></dialog>
<script src="config.js"></script><script src="content-english-hass.js"></script><script src="content-maths.js"></script><script src="content-science.js"></script><script src="content-synthesis.js"></script><script src="app.js"></script></body></html>
