<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background-color: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; color: #2C2C2C;
}
.header { background-color: #1A3A6B; padding: 15pt 40pt; color: #FFFFFF; }
h2 { font-size: 22pt; margin: 0; }
.content { padding: 30pt; display: flex; gap: 30pt; flex: 1; align-items: center; }
.left { flex: 1; }
.right { flex: 1; background-color: #F0F4F8; padding: 15pt; border-radius: 10pt; border: 1pt solid #CCCCCC; height: 180pt; display: flex; align-items: center; justify-content: center; }
h3 { font-size: 24pt; color: #2E6BC6; margin: 0 0 15pt 0; }
ul { font-size: 16pt; }
li { margin-bottom: 8pt; }
</style>
</head>
<body>
  <div class="header">
    <h2>Worksheet Time</h2>
  </div>
  <div class="content">
    <div class="left">
      <h3>Your Turn!</h3>
      <ul>
        <li>Complete the 5 activities.</li>
        <li>Be specific with your examples.</li>
        <li>Think critically about the "Messenger".</li>
      </ul>
    </div>
    <div class="right">
      <div style="text-align: center; color: #999999;">
        <p style="font-size: 30pt; margin: 0;">📄</p>
        <p><b>Lesson 1 Worksheet</b></p>
      </div>
    </div>
  </div>
</body>
</html>
