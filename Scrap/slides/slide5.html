<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background-color: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; color: #2C2C2C;
}
.header { background-color: #1A3A6B; padding: 15pt 40pt; color: #FFFFFF; }
h2 { font-size: 22pt; margin: 0; }
.content { padding: 20pt; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15pt; flex: 1; }
.media-card { background-color: #D6E4F7; border-radius: 10pt; padding: 12pt; text-align: center; border: 2pt solid #2E6BC6; display: flex; flex-direction: column; justify-content: center; }
h4 { font-size: 16pt; margin: 0; color: #1A3A6B; }
p { font-size: 13pt; margin-top: 5pt; }
</style>
</head>
<body>
  <div class="header">
    <h2>Where do we find them?</h2>
  </div>
  <div class="content">
    <div class="media-card"><h4>Television</h4><p>Adverts, News, Docs</p></div>
    <div class="media-card"><h4>Social Media</h4><p>Influencers, Posts</p></div>
    <div class="media-card"><h4>Billboards</h4><p>Public visual messages</p></div>
    <div class="media-card"><h4>Websites</h4><p>Articles, Health Blogs</p></div>
    <div class="media-card"><h4>Radio/Podcasts</h4><p>Audio discussions</p></div>
    <div class="media-card"><h4>Print Media</h4><p>Magazines, Posters</p></div>
  </div>
</body>
</html>
