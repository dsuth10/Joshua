<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background-color: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; color: #2C2C2C;
}
.header { background-color: #1A3A6B; padding: 15pt 40pt; color: #FFFFFF; }
h2 { font-size: 22pt; margin: 0; }
.content { display: flex; flex: 1; padding: 25pt; gap: 25pt; }
.left { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.right { flex: 1; background-color: #F0F4F8; border-radius: 10pt; border: 2pt dashed #2E6BC6; display: flex; align-items: center; justify-content: center; }
p { font-size: 18pt; line-height: 1.3; }
ul { font-size: 16pt; }
.box { background-color: #D6E4F7; padding: 12pt; border-radius: 8pt; border-left: 5pt solid #1A3A6B; margin-top: 15pt; }
</style>
</head>
<body>
  <div class="header">
    <h2>Hook: What is the Message?</h2>
  </div>
  <div class="content">
    <div class="left">
      <p>Look at these well-known campaigns:</p>
      <ul>
        <li><b>Slip! Slop! Slap!</b></li>
        <li><b>R U OK?</b></li>
        <li><b>Swap It, Don't Stop It</b></li>
      </ul>
      <div class="box">
        <p><b>What health message are they sending?</b></p>
      </div>
    </div>
    <div class="right">
      <div style="text-align: center; color: #2E6BC6;">
        <p>[Health Campaign Visuals]</p>
        <p style="font-size: 12pt;">Imagine the logos and slogans here...</p>
      </div>
    </div>
  </div>
</body>
</html>
