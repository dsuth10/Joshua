<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background-color: #D6E4F7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; color: #2C2C2C;
}
.header { background-color: #1A3A6B; padding: 15pt 40pt; color: #FFFFFF; }
h2 { font-size: 22pt; margin: 0; }
.content { padding: 30pt; display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
.definition-box { background-color: #FFFFFF; padding: 25pt; border-radius: 15pt; box-shadow: 0 10pt 20pt rgba(0,0,0,0.1); border-top: 10pt solid #2E6BC6; max-width: 500pt; text-align: center; }
p.def { font-size: 20pt; line-height: 1.4; color: #1A3A6B; font-weight: bold; }
p.sub { font-size: 14pt; margin-top: 15pt; color: #666666; }
</style>
</head>
<body>
  <div class="header">
    <h2>What is a Health Message?</h2>
  </div>
  <div class="content">
    <div class="definition-box">
      <p class="def">"A health message is information designed to encourage people to make healthy choices or change their behaviour to improve their wellbeing."</p>
    </div>
    <p class="sub">Think: Nutrition, Exercise, Sun Safety, Mental Health, Hygiene</p>
  </div>
</body>
</html>
