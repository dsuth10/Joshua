<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background-color: #D6E4F7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; color: #2C2C2C;
}
.header { background-color: #1A3A6B; padding: 15pt 40pt; color: #FFFFFF; }
h2 { font-size: 22pt; margin: 0; }
.content { padding: 30pt; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.q-box { background-color: #FFFFFF; padding: 25pt; border-radius: 20pt; border: 4pt solid #2E6BC6; max-width: 550pt; }
.q-box p { font-size: 20pt; font-weight: bold; color: #1A3A6B; margin: 0; }
.small p { font-size: 14pt; margin-top: 15pt; color: #666666; font-weight: normal; }
</style>
</head>
<body>
  <div class="header">
    <h2>Reflection</h2>
  </div>
  <div class="content">
    <div class="q-box">
      <p>How much do health messages from high-profile people influence YOUR choices?</p>
      <div class="small">
        <p>Think about: The food you eat, the sports you play, the products you buy, and how you treat others.</p>
      </div>
    </div>
  </div>
</body>
</html>
