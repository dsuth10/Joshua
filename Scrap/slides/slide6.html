<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background-color: #D6E4F7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; color: #2C2C2C;
}
.header { background-color: #1A3A6B; padding: 15pt 40pt; color: #FFFFFF; }
h2 { font-size: 22pt; margin: 0; }
.content { padding: 20pt 50pt; flex: 1; }
.match-box { background-color: #FFFFFF; padding: 15pt; border-radius: 10pt; display: flex; flex-direction: column; gap: 5pt; }
.row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1pt solid #EEEEEE; }
.label { font-size: 16pt; font-weight: bold; color: #2E6BC6; flex: 1; }
.target { font-size: 16pt; font-style: italic; color: #666666; flex: 1; text-align: right; }
p { margin: 5pt 0; }
</style>
</head>
<body>
  <div class="header">
    <h2>Matching Audience to Message</h2>
  </div>
  <div class="content">
    <div class="match-box">
      <div class="row"><div class="label"><p>Healthy Lunchbox App</p></div><div class="target"><p>Parents & Caregivers</p></div></div>
      <div class="row"><div class="label"><p>"Stay Hydrated" Viral Dance</p></div><div class="target"><p>Teenagers / Students</p></div></div>
      <div class="row"><div class="label"><p>Flu Shots for Seniors</p></div><div class="target"><p>The Elderly</p></div></div>
      <div class="row"><div class="label"><p>No Smoking Billboard</p></div><div class="target"><p>The General Public</p></div></div>
    </div>
    <p style="text-align: center; font-size: 14pt; margin-top: 15pt;"><b>Why does the target audience matter?</b></p>
  </div>
</body>
</html>
