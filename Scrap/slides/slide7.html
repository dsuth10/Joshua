<!DOCTYPE html>
<html>
<head>
<style>
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background-color: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; color: #2C2C2C;
}
.header { background-color: #1A3A6B; padding: 15pt 40pt; color: #FFFFFF; }
h2 { font-size: 22pt; margin: 0; }
.content { padding: 20pt 30pt; display: flex; flex-direction: column; flex: 1; }
.framework { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15pt; margin-top: 15pt; }
.step { background-color: #1A3A6B; color: #FFFFFF; border-radius: 10pt; padding: 15pt; text-align: center; }
.step.two { background-color: #2E6BC6; }
.step.three { background-color: #D6E4F7; color: #1A3A6B; border: 2pt solid #1A3A6B; }
h4 { font-size: 20pt; margin: 0 0 8pt 0; }
p { font-size: 13pt; line-height: 1.3; }
</style>
</head>
<body>
  <div class="header">
    <h2>Evaluating Credibility</h2>
  </div>
  <div class="content">
    <p style="font-size: 16pt;">How do we know if a health message is <b>trustworthy?</b></p>
    <div class="framework">
      <div class="step"><h4>Purpose</h4><p>Why was it created? To help, or to sell something?</p></div>
      <div class="step two"><h4>Information</h4><p>Is it based on facts? Who researched it?</p></div>
      <div class="step three"><h4>Messenger</h4><p>Who is giving the message? Are they an expert?</p></div>
    </div>
  </div>
</body>
</html>
