<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua Math Practice | Prep Mission Bay</title>
    <meta name="description" content="Foundation mathematics practice for Prep — drag-and-drop counting with audio prompts.">
    <link rel="stylesheet" href="style.css">
</head>

<body class="theme-sunrise band-a-layout">
    <div class="terminal-layout">
        <header class="system-header">
            <div class="system-title">
                <h1>Prep Mission Bay</h1>
                <span class="accent-tag">PRAC_PREP</span>
                <a href="index.html" class="nav-link-btn" id="btn-goto-portal" style="margin-left: 16px;">Main Portal</a>
            </div>
            <div class="system-status">
                <div class="status-indicator">
                    <span class="status-dot" id="practice-status-dot"></span>
                    <span id="practice-status-text">BAND A PRACTICE</span>
                </div>
                <div>FOUNDATION // AUDIO PROMPTS ON</div>
            </div>
        </header>

        <main class="dashboard-workspace">
            <aside class="terminal-panel panel-left">
                <div class="panel-header">
                    <span>CREW_LEDGER</span>
                    <span class="code-tag">[PROFILE]</span>
                </div>
                <div class="panel-content" style="display:flex; flex-direction:column; gap:16px;">
                    <div class="profile-card">
                        <div class="profile-avatar-area">
                            <div class="avatar-circle" id="profile-avatar">E</div>
                            <div class="flex-col">
                                <input type="text" class="profile-name-input" id="profile-name-edit" value="ENGINEER" maxlength="12" title="Edit Profile Name" aria-label="Edit Profile Name">
                                <div style="margin-top: 4px;">
                                    <span class="rank-pill" id="profile-rank">Rookie Explorer</span>
                                </div>
                            </div>
                        </div>
                        <div class="level-progress-container">
                            <div class="flex-row justify-between" style="font-size:0.75rem; color:var(--on-surface-variant); font-weight:600; margin-bottom: 2px;">
                                <span id="profile-level">Level 1</span>
                                <span id="profile-level-ratio">0/100 PTS</span>
                            </div>
                            <div class="progress-bar-thin">
                                <div class="progress-bar-fill-thin" id="profile-progress-fill"></div>
                            </div>
                        </div>
                        <div class="flex-row justify-between" style="font-size: 0.8rem; font-weight:700;">
                            <span>SCORE:</span>
                            <span id="profile-score" style="color:var(--primary);">0 PTS</span>
                        </div>
                    </div>
                    <div class="flex-col gap-8" style="margin-top: 8px;">
                        <div class="panel-header" style="background:transparent; border:none; padding:0; font-size:0.75rem; border-bottom:1px solid var(--outline-variant); padding-bottom:6px;">
                            <span>LAST_BADGES</span>
                        </div>
                        <div class="badge-shelf" id="badge-shelf-container"></div>
                    </div>
                    <button type="button" class="nav-link-btn band-a-adult-console-toggle" id="btn-adult-console" aria-expanded="false" aria-controls="band-a-adult-console">Adult console</button>
                    <div class="band-a-adult-console" id="band-a-adult-console" aria-hidden="true">
                        <div id="adult-console-summary"></div>
                    </div>
                </div>
            </aside>

            <section class="terminal-panel panel-center">
                <div class="panel-header">
                    <span>MISSION_WORKSPACE</span>
                    <span class="code-tag" id="practice-code">[PREP]</span>
                </div>
                <div class="panel-content" style="display:flex; flex-direction:column; min-height:0;">
                    <div class="practice-selectors">
                        <button class="selector-tab active" id="tab-number" data-task="number" data-strand="number">🚀 Numbers</button>
                        <button class="selector-tab" id="tab-patterns" data-task="patterns" data-strand="algebra">🧩 Patterns</button>
                        <button class="selector-tab" id="tab-measuring" data-task="measuring" data-strand="measurement">⚖️ Measuring</button>
                        <button class="selector-tab" id="tab-space" data-task="space" data-strand="space">🗺️ Space</button>
                        <button class="selector-tab" id="tab-statistics" data-task="statistics" data-strand="statistics">📊 Data</button>
                    </div>

                    <div style="flex-grow: 1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:16px;">
                        <div class="question-card" id="practice-workspace-card" style="flex-grow:1; display:flex; flex-direction:column;">
                            <div class="flex-row justify-between align-center" style="border-bottom:1px solid var(--outline-variant); padding-bottom:8px; margin-bottom:12px;">
                                <div class="flex-row align-center gap-12">
                                    <h3 id="prac-task-title" style="margin-bottom:0; color:var(--primary);">LOADING...</h3>
                                    <button type="button" class="mcs-prompt-audio-btn" id="btn-prompt-audio" title="Hear the mission again" aria-label="Replay audio prompt">🔊</button>
                                    <span class="mcs-prompt-numeral" id="prac-prompt-numeral" aria-hidden="true"></span>
                                </div>
                                <span class="rank-pill" id="prac-attempts-left">2 TRIES LEFT</span>
                            </div>

                            <div id="prac-interactive-panel" style="flex-grow:1; display:flex; flex-direction:column; justify-content:center; min-height: 280px;"></div>

                            <div class="hint-box" id="prac-hint-container" style="display:none;">
                                <div style="font-weight:700; color:var(--primary);">💡 Try again:</div>
                                <div id="prac-hint-content"></div>
                            </div>
                            <div class="hint-box solution-box" id="prac-solution-container" style="display:none;">
                                <div style="font-weight:700; color:var(--error);">Here is the answer:</div>
                                <div id="prac-solution-content"></div>
                            </div>
                        </div>

                        <div class="flex-row align-center justify-between" style="padding-top:8px;">
                            <div id="prac-feedback-banner">
                                <div class="active-feedback-text feedback-success" id="prac-feedback-text" style="display:none;">GREAT JOB!</div>
                            </div>
                            <div class="flex-row gap-12" style="margin-left:auto;">
                                <button class="btn-terminal band-a-action-btn" id="btn-prac-reset-widget" type="button">↺ Reset</button>
                                <button class="btn-terminal primary band-a-action-btn" id="btn-prac-submit" disabled>CHECK</button>
                                <button class="btn-terminal primary band-a-action-btn" id="btn-prac-next" style="display:none;">NEXT</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="achievements-config.js"></script>
    <script defer src="vendor/jsxgraph/jsxgraphcore.js"></script>
    <script defer src="vendor/konva/konva.min.js"></script>
    <script defer src="mcs-question-picker.js"></script>
    <script defer src="widgets/mcs-core.js"></script>
    <script defer src="widgets/mcs-board.js"></script>
    <script defer src="widgets/mcs-stage.js"></script>
    <script defer src="widgets/mcs-widgets-number.js"></script>
    <script defer src="widgets/mcs-widgets-data.js"></script>
    <script defer src="widgets/mcs-widgets-space.js"></script>
    <script defer src="widgets/mcs-widgets-measure.js"></script>
    <script defer src="widgets/mcs-input.js"></script>
    <script defer src="widgets/mcs-question-adapter.js"></script>
    <script defer src="band-a-practice-common.js"></script>
    <script defer src="prep-practice.js"></script>
</body>

</html>
