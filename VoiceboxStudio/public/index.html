<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voicebox Student Studio — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">🎙️</div>
        <h1 class="login-title">Voicebox Studio</h1>
        <p class="login-subtitle">Sign in to your student account</p>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            id="username"
            type="text"
            class="form-input"
            placeholder="Enter your username"
            autocomplete="off"
            required
          />
        </div>
        <div class="form-group">
          <label for="pin" class="form-label">PIN</label>
          <input
            id="pin"
            type="password"
            class="form-input"
            placeholder="Enter your PIN"
            maxlength="10"
            autocomplete="off"
            required
          />
        </div>

        <div id="login-error" class="error-banner" style="display:none;"></div>

        <button id="login-btn" type="submit" class="btn btn-primary btn-lg btn-full">
          <span class="btn-text">Sign In</span>
          <span class="btn-spinner" style="display:none;">⟳</span>
        </button>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (sessionStorage.getItem('vb_token')) {
      window.location.href = 'app.html';
    }
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      const username = document.getElementById('username').value.trim();
      const pin = document.getElementById('pin').value.trim();

      btn.querySelector('.btn-text').style.display = 'none';
      btn.querySelector('.btn-spinner').style.display = 'inline';
      btn.disabled = true;
      errEl.style.display = 'none';

      try {
        const data = await login(username, pin);
        sessionStorage.setItem('vb_token', data.token);
        sessionStorage.setItem('vb_display', data.displayName);
        window.location.href = 'app.html';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        btn.querySelector('.btn-text').style.display = 'inline';
        btn.querySelector('.btn-spinner').style.display = 'none';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
