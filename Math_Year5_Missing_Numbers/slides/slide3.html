<!DOCTYPE html>
<html>
<head>
<style>
html { background: #f9f7f7; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  color: #112d4e;
}
.header { background: #112d4e; padding: 20pt 40pt; }
h1 { font-size: 28pt; margin: 0; color: #f96d00; }
.content { padding: 40pt; display: flex; justify-content: space-around; align-items: center; flex: 1; }
.circle { width: 130pt; height: 130pt; background: #3f72af; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 36pt; font-weight: bold; }
.prompt { font-size: 22pt; text-align: center; margin-top: 20pt; color: #f96d00; }
</style>
</head>
<body>
<div class="header">
  <h1>Warm-up: Fact Family Flash!</h1>
</div>
<div class="content">
  <div class="circle"><p>3</p></div>
  <div class="circle"><p>4</p></div>
  <div class="circle"><p>12</p></div>
</div>
<div style="padding: 0 40pt 40pt 40pt;">
  <p class="prompt">Shout out the 4 related facts for these numbers!</p>
</div>
</body>
</html>
