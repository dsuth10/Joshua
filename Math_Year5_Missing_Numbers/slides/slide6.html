<!DOCTYPE html>
<html>
<head>
<style>
html { background: #f9f7f7; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f9f7f7; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  color: #112d4e;
}
.header { background: #112d4e; padding: 15pt 40pt; }
h1 { font-size: 28pt; margin: 0; color: #f96d00; }
.content { padding: 20pt; flex: 1; }
.challenge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10pt; margin-top: 10pt; }
.challenge-item { background: white; padding: 10pt; border-radius: 8pt; border: 1pt dashed #112d4e; font-size: 20pt; font-weight: bold; text-align: center; }
h2 { font-size: 20pt; color: #f96d00; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <h1>Guided Practice: Your Turn!</h1>
</div>
<div class="content">
  <h2>Solve these on your mini-whiteboards:</h2>
  <div class="challenge-grid">
    <div class="challenge-item"><p>[ ] × 7 = 42</p></div>
    <div class="challenge-item"><p>9 × [ ] = 63</p></div>
    <div class="challenge-item"><p>[ ] + 156 = 365</p></div>
    <div class="challenge-item"><p>180 - [ ] = 60</p></div>
  </div>
  <p style="text-align: center; font-size: 18pt; margin-top: 20pt; color: #3f72af; font-style: italic;">Think: What is the inverse operation?</p>
</div>
</body>
</html>
