<script>
const diagram = document.querySelector('#diagram svg');
function svgText() { const copy=diagram.cloneNode(true); copy.setAttribute('xmlns','http://www.w3.org/2000/svg'); return new XMLSerializer().serializeToString(copy); }
document.querySelector('#svg-download').addEventListener('click', () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([svgText()],{type:'image/svg+xml'})); a.download='Three lamps in parallel.svg'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); });
document.querySelector('#png-download').addEventListener('click', () => { const image=new Image(); const blob=new Blob([svgText()],{type:'image/svg+xml'}); const url=URL.createObjectURL(blob); image.onload=()=>{ const vb=diagram.viewBox.baseVal; const scale=3; const canvas=document.createElement('canvas'); canvas.width=Math.ceil(vb.width*scale); canvas.height=Math.ceil(vb.height*scale); const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(image,0,0,canvas.width,canvas.height); URL.revokeObjectURL(url); canvas.toBlob(out=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(out); a.download='Three lamps in parallel.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); },'image/png'); }; image.src=url; });
</script>
