      - 'heading "Electricity: explain, test, repair" [level=1] [ref=e7]'
      - paragraph [ref=e8]: Student assessment · Tinkercad edition
      - paragraph [ref=e9]: "Name: __________________________ Class: __________ Date: __________"
      - heading "Your challenge" [level=2] [ref=e10]
      - paragraph [ref=e11]: Show how a circuit works, use an Arduino to control an LED, and investigate a circuit that does not work as intended. Then explain how electricity is generated and why different places might choose different energy sources.
      - heading "What you will submit" [level=2] [ref=e12]
      - list [ref=e13]:
        - listitem [ref=e14]: Your reasoning about six circuit sketches.
        - listitem [ref=e15]: Your labelled Arduino circuit, predictions and test results.
        - listitem [ref=e16]: A fault investigation with before-and-after evidence.
        - listitem [ref=e17]: Three energy-source explanations and a justified recommendation.
      - heading "Working expectations" [level=2] [ref=e18]
      - paragraph [ref=e19]: Work individually. Your teacher supplies the starter code and explains the software controls. You are assessed on Science understanding, not typing speed or writing code from memory. Record what actually happens—even when it differs from your prediction.
      - paragraph [ref=e20]: Use Tinkercad Circuits only. Stop the simulation before changing a connection. Do not connect real hardware or mains electricity for this task.
      - heading "Useful evidence" [level=2] [ref=e21]
      - paragraph [ref=e22]: Use labelled sketches, screenshots, observations and explanations. Label terminals, pins and components, not just wire colours. A screenshot alone does not explain why a circuit works.
      - heading "Before starting" [level=2] [ref=e23]
      - paragraph [ref=e24]: Check that you can open a circuit, identify component terminals, edit a wire, use the supplied code and start/stop a simulation. Ask your teacher if access or these controls are unfamiliar.
