          - generic [ref=f1e192]: Planning notes from the two communities Bayview is a fictional coastal town in Australia. Its festival committee plans an outdoor screen at the community oval in late autumn. Families have asked for a quiet reading tent, reusable water bottles and a short walk from the bus stop. The oval is wide and flat, but the afternoon can become cool and windy. Suka Jaya is a fictional town in Indonesia. Its committee plans to use a covered community courtyard in the dry season. Families have asked for shaded seating, a place to refill drinking water and a display where children can share stories from home. The courtyard is smaller than Bayview Oval, but it is close to shops and many people walk there. Australia and Indonesia are neighbours in the same region of the world, but they have different histories, languages, climates and populations. Both countries have many communities, many ways of living and strong cultural traditions. A respectful comparison looks for useful similarities and differences without pretending that every Australian or every Indonesian person has the same experience.
